<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="auth-body">

    <!-- Tab switcher -->
    <div class="auth-tabs">
        <a href="{{ url_for('auth.login') }}" style="text-decoration:none;">
            <button class="auth-tab-btn">Sign in</button>
        </a>
        <button class="auth-tab-btn active">Create account</button>
    </div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <p class="auth-eyebrow">Get started</p>
                <h1>Create your<br><em>account.</em></h1>
                <p>Join the platform — it only takes a minute.</p>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for c, m in messages %}
                    <div class="alert alert-{{ c }}">
                        <i class="ti ti-info-circle" aria-hidden="true"></i>
                        <span>{{ m }}</span>
                        <button type="button" class="close-alert" aria-label="Dismiss">&times;</button>
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" class="auth-form">

                <div class="form-group">
                    <label for="name">Full name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="ti ti-user" aria-hidden="true"></i>
                        </span>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Jane Doe"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="ti ti-mail" aria-hidden="true"></i>
                        </span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="ti ti-lock" aria-hidden="true"></i>
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="role">Register as</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <i class="ti ti-id-badge" aria-hidden="true"></i>
                            </span>
                            <select id="role" name="role" required>
                                <option value="" disabled selected>Select…</option>
                                <option value="student">Student</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <i class="ti ti-gender-bigender" aria-hidden="true"></i>
                            </span>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select…</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date_of_birth">Date of birth</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i class="ti ti-calendar" aria-hidden="true"></i>
                        </span>
                        <input
                            type="date"
                            id="date_of_birth"
                            name="date_of_birth"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="auth-btn">Create account →</button>

            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a></p>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
