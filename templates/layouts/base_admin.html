<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<header class="topbar">
    <button id="menu-toggle" class="menu-btn" aria-label="Toggle menu">
        <i class="ti ti-menu-2"></i>
    </button>
    <h2>Admin Panel</h2>
    <div class="topbar-right">
        <button id="theme-toggle" class="theme-btn" title="Toggle theme">
            <i class="ti ti-moon"></i>
        </button>
        <div class="admin-info">
            <span class="admin-name">{{ session.get('name', 'Admin') }}</span>
            <span class="admin-email">{{ session.get('email', '') }}</span>
        </div>
    </div>
</header>

<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>Navigation</h3>
    </div>
    <ul class="sidebar-menu">
        <li>
            <a href="{{ url_for('admin.dashboard') }}" class="menu-item">
                <i class="ti ti-layout-dashboard"></i> Dashboard
            </a>
        </li>
        <li>
            <a href="{{ url_for('admin.admin_students') }}" class="menu-item">
                <i class="ti ti-school"></i> Students
            </a>
        </li>
        <li>
            <a href="{{ url_for('admin.admin_lecturers') }}" class="menu-item">
                <i class="ti ti-chalkboard"></i> Lecturers
            </a>
        </li>
        <li>
            <a href="{{ url_for('admin.admin_requests') }}" class="menu-item">
                <i class="ti ti-clipboard-list"></i> Requests
            </a>
        </li>
        <li>
            <a href="{{ url_for('auth.logout') }}" class="menu-item logout">
                <i class="ti ti-logout"></i> Logout
            </a>
        </li>
    </ul>
</aside>

<main id="content" class="content">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
