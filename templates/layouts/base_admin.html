<body>

<!-- Top bar -->
<header class="topbar">
    <button id="menu-toggle" class="menu-btn">☰</button>
    <h2>Admin Panel</h2>
    <div class="topbar-right">
        <button id="theme-toggle" class="theme-btn" title="Toggle theme">🌙</button>
        <div class="admin-info">
            <span class="admin-name">{{ session.get('name', 'Admin') }}</span>
            <span class="admin-email">{{ session.get('email', '') }}</span>
        </div>
    </div>
</header>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>Menu</h3>
    </div>
    <ul class="sidebar-menu">
        <li><a href="{{ url_for('admin.dashboard') }}" class="menu-item">📊 Dashboard</a></li>
        <li><a href="{{ url_for('admin.admin_students') }}" class="menu-item">👨‍🎓 Students</a></li>
        <li><a href="{{ url_for('admin.admin_lecturers') }}" class="menu-item">👨‍🏫 Lecturers</a></li>
        <li><a href="{{ url_for('admin.admin_requests') }}" class="menu-item">📋 Requests</a></li>
        <li><a href="{{ url_for('auth.logout') }}" class="menu-item logout">🚪 Logout</a></li>
    </ul>
</aside>

<!-- Main content -->
<main id="content" class="content">
    {% block content %}{% endblock %}
</main>

<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>

</body>
