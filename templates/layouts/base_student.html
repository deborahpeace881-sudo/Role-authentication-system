<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Student Panel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<header class="topbar"> 
    <button id="menu-toggle" class="menu-btn" aria-label="Toggle menu">
        <i class="ti ti-menu-2"></i>
    </button>
    <h2>Student Panel</h2>
    <div class="topbar-right">
        <button id="theme-toggle" class="theme-btn" title="Toggle theme">
            <i class="ti ti-moon"></i>
        </button>
        <div class="admin-info">
            <span class="admin-name">{{ session.get('name', 'Student') }}</span>
            <span class="admin-email">{{ session.get('email', '') }}</span>
        </div>
    </div>
</header>

<aside id="sidebar" class="sidebar"> 
    <div class="sidebar-header">
        <h3>Navigation</h3>
    </div>
    <ul class="sidebar-menu">
        <li>
            <a href="{{ url_for('student.student_dashboard') }}" class="menu-item">
                <i class="ti ti-layout-dashboard"></i> Dashboard
            </a>
        </li>
        <li>
            <a href="{{ url_for('student.student_courses') }}" class="menu-item">
                <i class="ti ti-book"></i> Courses
            </a>
        </li>
        <li>
            <a href="{{ url_for('student.student_materials') }}" class="menu-item">
                <i class="ti ti-folder"></i> Materials
            </a>
        </li>
        <li>
            <a href="{{ url_for('student.student_assignments') }}" class="menu-item">
                <i class="ti ti-clipboard-text"></i> Assignments/Tests
            </a>
        </li>
        <li>
            <a href="{{ url_for('student.student_results') }}" class="menu-item">
                <i class="ti ti-chart-bar"></i> Results
            </a>
        </li>
        <li>
            <a href="{{ url_for('student.student_profile') }}" class="menu-item">
                <i class="ti ti-user"></i> Profile
            </a>
        </li>
        <li>
            <a href="{{ url_for('auth.logout') }}" class="menu-item logout">
                <i class="ti ti-logout"></i> Logout
            </a>
        </li>
    </ul>
</aside>

<main id="content" class="content"> 
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
