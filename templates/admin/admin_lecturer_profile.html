{% extends "layouts/base_admin.html" %}
{% block title %}Lecturer Profile{% endblock %}

{% block content %}
<div class="dashboard-container">

    <a href="{{ url_for('admin.admin_lecturers') }}" class="back-link">
        <i class="ti ti-arrow-left"></i> Back to Lecturers
    </a>

    <div class="profile-card">
        <h2>Lecturer Profile</h2>

        <div class="profile-info">
            <div class="profile-row">
                <span class="label">Email</span>
                <span class="value">{{ lecturer.email }}</span>
            </div>
            <div class="profile-row">
                <span class="label">Gender</span>
                <span class="value">{{ lecturer.gender }}</span>
            </div>
            <div class="profile-row">
                <span class="label">Date of Birth</span>
                <span class="value">{{ lecturer.date_of_birth }}</span>
            </div>
        </div>

    </div>

</div>
{% endblock %}
