{% extends "layouts/base_admin.html" %}
{% block title %}Students{% endblock %}

{% block content %}
<div class="dashboard-container">

    <a href="{{ url_for('admin.dashboard') }}" class="back-link">
        <i class="ti ti-arrow-left"></i> Back to Dashboard
    </a>

    <div class="page-header">
        <h2>Students</h2>
        <p class="subtitle">View and manage all registered students.</p>
    </div>

    <div class="table-wrapper">
        <table class="students-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.email }}</td>
                    <td>
                        <div class="td-actions">
                            <a href="{{ url_for('admin.admin_student_profile', uid=s.uid) }}" class="action-btn">
                                <i class="ti ti-eye"></i> View Profile
                            </a>
                            <a href="{{ url_for('admin.admin_override_results', uid=s.uid) }}" class="action-btn create-btn">
                                <i class="ti ti-edit"></i> Override Results
                            </a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>
{% endblock %}
