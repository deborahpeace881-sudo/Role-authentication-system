{% extends "layouts/base_admin.html" %}
{% block title %}Students{% endblock %}
{% block header_title %}Students{% endblock %}
{% block content %}
<div class="dashboard-container">
    <h2>Students List</h2>
    <div class="students-list">
        <table class="students-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.email }}</td>
                    <td>
                        <a href="{{ url_for('admin.admin_student_profile', uid=s.uid) }}" class="action-btn">View Profile</a>
                        <a href="{{ url_for('admin.admin_override_results', uid=s.uid) }}" class="action-btn" style="background:#2ecc40;">Override Results</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="action-btn" style="margin-top:20px;">⬅ Back to Admin Dashboard</a>
</div>
{% endblock %}
