{% extends "layouts/base_admin.html" %}

{% block content %}
<div class="form-container">
    <h1>Edit Course</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for c, m in messages %}
            <div class="alert alert-{{ c }}">
                <span>{{ m }}</span>
                <button type="button" class="close-alert">&times;</button>
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST" class="admin-form">
        <div class="form-group">
            <label for="name">Course Name</label>
            <input type="text" id="name" name="name" value="{{ course.name }}" required>
        </div>

        <div class="form-group">
            <label for="code">Course Code</label>
            <input type="text" id="code" name="code" value="{{ course.code }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required>{{ course.description }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="credits">Credits</label>
                <input type="number" id="credits" name="credits" min="1" max="6" value="{{ course.credits }}" required>
            </div>

            <div class="form-group">
                <label for="max_students">Max Students</label>
                <input type="number" id="max_students" name="max_students" min="1" value="{{ course.max_students }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" value="{{ course.department }}" required>
        </div>

        <button type="submit" class="btn-submit">Update Course</button>
        <a href="{{ url_for('courses.admin_courses') }}" class="btn-cancel">Cancel</a>
    </form>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
